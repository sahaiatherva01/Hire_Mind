<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — HireMind</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page">

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand"><span class="brand-mark"></span> HireMind</a>
  </div>
</header>

<main class="main">
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Welcome back</h1>
      <p class="text-dim">Log in to continue your placement track.</p>

      <div class="form-error" id="form-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>

      <div class="auth-switch">Don't have an account? <a href="/signup.html">Sign up</a></div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script>
const form = document.getElementById("login-form");
const errorBox = document.getElementById("form-error");
const submitBtn = document.getElementById("submit-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("visible");
  submitBtn.disabled = true;
  submitBtn.textContent = "Logging in…";
  try {
    await API.post("/api/auth/login", {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });
    window.location.href = "/dashboard.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add("visible");
    submitBtn.disabled = false;
    submitBtn.textContent = "Log in";
  }
});
</script>
</body>
</html>
