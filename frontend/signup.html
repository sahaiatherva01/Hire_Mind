<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — HireMind AI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">

  <div class="glass-card" style="width:100%; max-width:480px; padding:2.5rem;">
    <div style="text-align:center; margin-bottom:2rem;">
      <a href="/" style="text-decoration:none; font-size:1.6rem; font-weight:800; color:#fff;">
        <span style="color:var(--color-primary);">⚡</span> HireMind
      </a>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.35rem;">Create your account to start your simulation.</p>
    </div>

    <form id="signup-form" style="display:flex; flex-direction:column; gap:1.25rem;">
      <div>
        <label style="font-size:0.85rem; font-weight:600; color:#fff; display:block; margin-bottom:0.4rem;">Full Name</label>
        <input type="text" id="signup-name" required placeholder="Atherva Sahai" style="width:100%; background:var(--bg-tertiary); color:#fff; border:1px solid var(--border-glass); padding:0.75rem 1rem; border-radius:var(--radius-md); font-family:var(--font-sans); font-size:0.95rem;">
      </div>

      <div>
        <label style="font-size:0.85rem; font-weight:600; color:#fff; display:block; margin-bottom:0.4rem;">Email Address</label>
        <input type="email" id="signup-email" required placeholder="alex@example.com" style="width:100%; background:var(--bg-tertiary); color:#fff; border:1px solid var(--border-glass); padding:0.75rem 1rem; border-radius:var(--radius-md); font-family:var(--font-sans); font-size:0.95rem;">
      </div>

      <div>
        <label style="font-size:0.85rem; font-weight:600; color:#fff; display:block; margin-bottom:0.4rem;">Account Role</label>
        <select id="signup-role" style="width:100%; background:var(--bg-tertiary); color:#fff; border:1px solid var(--border-glass); padding:0.75rem 1rem; border-radius:var(--radius-md); font-family:var(--font-sans); font-size:0.95rem;">
          <option value="candidate">Candidate (Job Preparation & Simulation)</option>
          <option value="recruiter">Recruiter (Enterprise Screening & Assessment)</option>
        </select>
      </div>

      <div>
        <label style="font-size:0.85rem; font-weight:600; color:#fff; display:block; margin-bottom:0.4rem;">Password</label>
        <input type="password" id="signup-password" required placeholder="••••••••" style="width:100%; background:var(--bg-tertiary); color:#fff; border:1px solid var(--border-glass); padding:0.75rem 1rem; border-radius:var(--radius-md); font-family:var(--font-sans); font-size:0.95rem;">
      </div>

      <div id="signup-error" style="display:none; color:var(--color-red); font-size:0.85rem;"></div>

      <button type="submit" class="btn btn-primary" style="padding:0.8rem; margin-top:0.5rem;">Create Account →</button>
    </form>

    <div style="margin-top:1.5rem; text-align:center; font-size:0.85rem; color:var(--text-muted);">
      Already have an account? <a href="/login" style="color:var(--color-accent); text-decoration:none; font-weight:600;">Log in</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const role = document.getElementById('signup-role').value;
      const password = document.getElementById('signup-password').value;
      const errEl = document.getElementById('signup-error');

      try {
        const res = await API.signup({ email, password, full_name: fullName, role });
        localStorage.setItem('hiremind_user', JSON.stringify(res.user));
        if (role === 'recruiter') {
          window.location.href = '/recruit';
        } else {
          window.location.href = '/dashboard';
        }
      } catch (err) {
        if (errEl) {
          errEl.style.display = 'block';
          errEl.textContent = err.message;
        }
      }
    });
  </script>
</body>
</html>
