<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — HireMind</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page">

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand"><span class="brand-mark"></span> HireMind</a>
  </div>
</header>

<main class="main">
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Create your account</h1>
      <p class="text-dim">Set up your profile and start with Practice Mode.</p>

      <div class="form-error" id="form-error"></div>

      <form id="signup-form">
        <div class="field">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
          <div class="text-faint" style="font-size:0.78rem;margin-top:4px;">At least 6 characters</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>

      <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script>
const form = document.getElementById("signup-form");
const errorBox = document.getElementById("form-error");
const submitBtn = document.getElementById("submit-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("visible");
  submitBtn.disabled = true;
  submitBtn.textContent = "Creating account…";
  try {
    await API.post("/api/auth/signup", {
      full_name: document.getElementById("full_name").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });
    window.location.href = "/dashboard.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add("visible");
    submitBtn.disabled = false;
    submitBtn.textContent = "Create account";
  }
});
</script>
</body>
</html>
