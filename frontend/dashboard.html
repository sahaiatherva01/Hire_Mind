<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — HireMind</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page">

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand"><span class="brand-mark"></span> HireMind</a>
    <nav class="nav-links">
      <span class="nav-user" id="nav-user"></span>
      <a href="#" id="logout-link">Log out</a>
    </nav>
  </div>
</header>

<main class="main">
  <div class="shell">
    <div class="row-between" style="margin-bottom: 28px; flex-wrap: wrap; gap: 16px;">
      <div>
        <h1 style="margin-bottom:4px;">Dashboard</h1>
        <p class="text-dim" style="margin:0;">Practice freely, or run the full simulation track.</p>
      </div>
      <div class="mode-toggle" id="mode-toggle">
        <button data-mode="practice" class="is-active">Practice</button>
        <button data-mode="simulation">Simulation</button>
      </div>
    </div>

    <!-- SIMULATION MODE VIEW -->
    <section id="simulation-view" style="display:none;">
      <div class="card" style="padding:20px; margin-bottom:24px;">
        <div class="row-between" style="margin-bottom:14px;">
          <h3 style="margin:0; font-size:0.95rem;">Placement Track</h3>
          <span class="text-faint" style="font-family:var(--font-mono); font-size:0.78rem;" id="track-name">TRACK: DEFAULT</span>
        </div>
        <div class="track-rail" id="track-rail"></div>
      </div>

      <div class="grid-3" id="simulation-cards"></div>
    </section>

    <!-- PRACTICE MODE VIEW -->
    <section id="practice-view">
      <div class="grid-3" id="practice-cards"></div>
    </section>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
