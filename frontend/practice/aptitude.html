<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireMind AI — Aptitude Round Practice & Simulation</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span style="color:var(--color-primary);">⚡</span> HireMind <span class="brand-badge">Aptitude Test</span>
    </a>
    <ul class="nav-links">
      <li><a href="/dashboard">Roadmap</a></li>
      <li><a href="/resume">Resume ATS+</a></li>
      <li><a href="/interview">AI Interviewer</a></li>
      <li><a href="/practice/aptitude.html" class="active">Aptitude</a></li>
      <li><a href="/practice/dsa.html">DSA Sandbox</a></li>
    </ul>
    <div class="nav-actions">
      <a href="/dashboard" class="btn btn-outline" style="padding:0.4rem 0.8rem; font-size:0.85rem;">Dashboard</a>
    </div>
  </nav>

  <main class="container">
    
    <!-- Aptitude Quiz Container -->
    <div id="aptitude-quiz-container">
      
      <!-- Top Test Status Bar -->
      <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center; padding:1.25rem 2rem; margin-bottom:1.5rem;">
        <div>
          <h3 style="margin-bottom:0.2rem;">Aptitude & Logical Reasoning Evaluation</h3>
          <span style="font-size:0.85rem; color:var(--text-muted);" id="current-q-num">Loading test questions...</span>
        </div>
        <div style="display:flex; align-items:center; gap:1.25rem;">
          <div style="text-align:right;">
            <span style="font-size:0.75rem; color:var(--text-subtle); display:block;">TIME REMAINING</span>
            <span class="mono-num" id="test-timer-display" style="font-size:1.4rem; color:var(--color-amber);">15:00</span>
          </div>
          <button id="btn-submit-aptitude" class="btn btn-primary" style="padding:0.6rem 1.25rem;">Submit Test</button>
        </div>
      </div>

      <div class="grid-4" style="grid-template-columns: 3fr 1fr; gap:1.5rem;">
        
        <!-- Active Question Box -->
        <div class="glass-card" style="padding:2rem;">
          <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
            <span class="badge badge-purple" id="current-q-topic">QUANTITATIVE</span>
            <span class="badge badge-blue" id="current-q-diff">MEDIUM</span>
          </div>

          <h3 id="current-q-text" style="font-size:1.2rem; color:#fff; line-height:1.6; margin-bottom:1.75rem;">
            Loading question text...
          </h3>

          <!-- Options Container -->
          <div id="current-options-container" style="display:flex; flex-direction:column; margin-bottom:1.5rem;">
            <!-- Rendered by aptitude.js -->
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-subtle); padding-top:1.25rem;">
            <button id="btn-prev-q" class="btn btn-secondary" style="padding:0.5rem 1.2rem;">← Previous</button>
            <button id="btn-next-q" class="btn btn-secondary" style="padding:0.5rem 1.2rem;">Next →</button>
          </div>
        </div>

        <!-- Question Palette Drawer -->
        <div class="glass-card" style="padding:1.5rem;">
          <h4 style="font-size:0.95rem; color:#fff; margin-bottom:1rem;">Question Palette</h4>
          <div id="question-palette" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:0.5rem;">
            <!-- Rendered by aptitude.js -->
          </div>
        </div>

      </div>

    </div>

    <!-- Results Card (Rendered on Submission) -->
    <div id="aptitude-results-card" style="display:none; margin-bottom:2rem;"></div>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/aptitude.js"></script>
</body>
</html>
