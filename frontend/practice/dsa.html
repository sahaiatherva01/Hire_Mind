<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Round — HireMind</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page">

<header class="topbar">
  <div class="topbar-inner">
    <a href="/dashboard.html" class="brand"><span class="brand-mark"></span> HireMind</a>
    <nav class="nav-links">
      <span class="pill" id="mode-pill">PRACTICE</span>
      <div class="timer" id="timer">--:--</div>
    </nav>
  </div>
</header>

<main class="main">
  <div class="shell">

    <!-- Problem picker (practice mode only) -->
    <div id="picker-view" class="card center" style="padding:48px; display:none;">
      <h1>DSA / Coding Round</h1>
      <p class="text-dim">Pick a problem to practice, or let HireMind choose one.</p>
      <div id="problem-list" class="grid-2" style="text-align:left; margin-top:24px;"></div>
      <button class="btn btn-secondary" id="random-btn" style="margin-top:20px;">Give me a random problem</button>
    </div>

    <!-- Simulation intro -->
    <div id="intro-view" class="card center" style="padding:48px; display:none;">
      <h1>DSA / Coding Round</h1>
      <p class="text-dim" id="intro-note"></p>
      <button class="btn btn-primary" id="start-sim-btn">Start round</button>
    </div>

    <!-- Editor view -->
    <div id="editor-view" style="display:none;">
      <div class="dsa-layout">
        <div class="card statement-card">
          <div class="row-between" style="margin-bottom:10px;">
            <h2 id="p-title" style="margin:0; font-size:1.15rem;"></h2>
            <span class="pill" id="p-difficulty"></span>
          </div>
          <p class="text-faint mono" id="p-topic" style="font-size:0.8rem; margin-bottom:16px;"></p>
          <p id="p-statement"></p>
          <div id="p-examples"></div>
        </div>

        <div>
          <div class="card">
            <div class="row-between" style="margin-bottom:10px;">
              <span class="text-faint mono" style="font-size:0.8rem;">solution.py</span>
              <div class="row gap-8">
                <button class="btn btn-secondary btn-sm" id="run-btn">Run tests</button>
                <button class="btn btn-primary btn-sm" id="submit-code-btn">Submit</button>
              </div>
            </div>
            <textarea id="code-editor" spellcheck="false"></textarea>
          </div>

          <div class="card" id="run-results-card" style="margin-top:16px; display:none;">
            <h3 style="font-size:0.9rem; margin-bottom:12px;">Public test results</h3>
            <div id="run-results"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Result view -->
    <div id="result-view" style="display:none; max-width:640px; margin:0 auto;">
      <div class="card score-hero">
        <div class="big-score" id="result-score">--</div>
        <div class="verdict" id="result-verdict"></div>
      </div>

      <div class="card" style="margin-top:20px;">
        <h3 style="font-size:0.95rem; margin-bottom:14px;">Score breakdown</h3>
        <div class="breakdown-row"><span>Correctness (50%)</span><span class="val" id="bd-correctness"></span></div>
        <div class="breakdown-row"><span>Complexity (20%)</span><span class="val" id="bd-complexity"></span></div>
        <div class="breakdown-row"><span>Code quality (15%)</span><span class="val" id="bd-quality"></span></div>
        <div class="breakdown-row"><span>Speed (15%)</span><span class="val" id="bd-speed"></span></div>
        <div class="breakdown-row"><span>Tests passed</span><span class="val" id="bd-tests"></span></div>
      </div>

      <div class="row gap-12" style="margin-top: 24px;">
        <a href="/dashboard.html" class="btn btn-secondary">Back to dashboard</a>
        <button class="btn btn-primary" id="retry-btn">Try another</button>
      </div>
    </div>

  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/dsa.js"></script>
</body>
</html>
